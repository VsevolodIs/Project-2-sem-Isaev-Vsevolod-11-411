{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; background: #1a1f3a; padding: 20px; border-radius: 10px; border: 1px solid #4a6fa5;">
    <h2 style="color: #ffd700; margin-top: 0;">✏️ Редактирование отзыва</h2>
    <p style="color: #ddd;">Станция: <strong style="color: #ffd700;">{{ review.station.name }}</strong></p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin-top: 20px; display: flex; gap: 15px;">
            <button type="submit" style="background: #4a6fa5; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Сохранить изменения 🚀
            </button>
            
            <a href="{% url 'stations:station_detail' review.station.id %}" style="padding: 10px 20px; color: #ffd700; text-decoration: none; border: 1px solid #4a6fa5; border-radius: 5px;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}

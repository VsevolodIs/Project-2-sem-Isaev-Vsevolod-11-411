{% extends 'base.html' %}
{% load socialaccount %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #4a6fa5; border-radius: 10px; background-color: #1a1f3a;">
    <h2 style="color: #ffd700;">Вход на Марс 🚀</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #4a6fa5; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">
            Войти
        </button>
    </form>

    <p style="margin-top: 15px; color: #ddd;">
        Нет аккаунта? <a href="{% url 'crew:register' %}" style="color: #ffd700;">Зарегистрироваться</a>
    </p>
    <p style="margin-top: 5px; font-size: 14px;">
        Забыли пароль?
        <a href="{% url 'crew:password_reset' %}" style="color: #ffd700;">Сбросить</a>
    </p>

    <hr style="margin: 20px 0;">
    <p style="text-align: center; margin-bottom: 10px;">Или войдите через</p>
    <a href="{% provider_login_url 'github' %}"
        style="display: block; text-align: center; background: #24292e; color: white; padding: 10px;
        border-radius: 5px; text-decoration: none;">
                Войти через GitHub
    </a>

</div>
{% endblock %}

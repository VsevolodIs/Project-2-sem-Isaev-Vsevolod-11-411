{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 30px; border: 2px solid #4a6fa5; border-radius: 15px; background-color: #1a1f3a;">
    <h2 style="color: #ffd700; text-align: center; margin-bottom: 25px;">🔄 Сброс пароля</h2>
    
    <p style="color: #ddd; text-align: center; margin-bottom: 20px;">
        Забыли пароль? Введите свой email, и мы отправим инструкцию для восстановления.
    </p>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label for="{{ form.email.id_for_label }}" style="color: #ffd700; display: block; margin-bottom: 8px;">
                Email:
            </label>
            {{ form.email }}
            {% if form.email.errors %}
                <div style="color: #ff6b6b; font-size: 12px; margin-top: 5px;">
                    {{ form.email.errors }}
                </div>
            {% endif %}
        </div>
        
        <button type="submit" style="background: #4a6fa5; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">
            Отправить инструкцию 🚀
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px;">
        <a href="{% url 'crew:login' %}" style="color: #ffd700; text-decoration: none;">← Вернуться ко входу</a>
    </p>
</div>
{% endblock %}

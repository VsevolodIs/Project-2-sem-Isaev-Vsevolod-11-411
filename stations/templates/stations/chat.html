{% extends 'base.html' %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #ffd700;">Комната: #{{ room_name }}</h2>
    <p style="color: #ddd; margin-bottom: 20px;">Общайтесь с колонизаторами Марса!</p>

    <div id="chat-log" style="height: 400px; border: 2px solid #4a6fa5; border-radius: 10px; padding: 15px; overflow-y: scroll; margin-bottom: 15px; background: #1a1f3a; color: #ddd;">
        <div style="text-align: center; color: #888; padding: 20px;">
            Подключение к комнате #{{ room_name }}...
        </div>
    </div>

    {% if user.is_authenticated %}
        <div style="margin-bottom: 10px; color: #ffd700; font-size: 14px;">
            Вы вошли как: <strong>{{ user.username }}</strong>
        </div>
    {% else %}
        <div style="margin-bottom: 10px; color: #ff6b6b; font-size: 14px;">
            Войдите в систему, чтобы отправлять сообщения
        </div>
    {% endif %}

    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input id="chat-message-input" type="text" placeholder="Введите сообщение..."
               style="flex-grow: 1; padding: 12px; border: 1px solid #4a6fa5; border-radius: 8px; background: #0a0f2a; color: white;"
               {% if not user.is_authenticated %}disabled{% endif %}>
        <button id="chat-message-submit"
                style="background: #4a6fa5; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: 0.3s;"
                {% if not user.is_authenticated %}disabled{% endif %}>
            Отправить
        </button>
    </div>
</div>

<script>
    const roomName = "{{ room_name|escapejs }}";

    const chatSocket = new WebSocket(
        'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        const chatLog = document.querySelector('#chat-log');

        const messageElement = document.createElement('div');
        messageElement.style.marginBottom = '8px';
        messageElement.style.lineHeight = '1.4';

        messageElement.innerHTML = `<strong style="color: #ffd700;">${data.username}</strong>: ${data.message}`;

        chatLog.appendChild(messageElement);
        chatLog.scrollTop = chatLog.scrollHeight;
    };

    chatSocket.onclose = function(e) {
        console.error('Чат неожиданно закрылся');
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value.trim();

        if (message) {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        }
    };

    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.key === 'Enter') {
            document.querySelector('#chat-message-submit').click();
        }
    };
</script>
{% endblock %}

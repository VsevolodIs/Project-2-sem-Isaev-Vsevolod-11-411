{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; text-align: center; background: #1a1f3a; padding: 30px; border-radius: 10px; border: 2px solid #ff6b6b;">
    <h2 style="color: #ff6b6b; margin-top: 0;">⚠️ Подтверждение удаления</h2>

    <p style="font-size: 16px; color: #ddd;">Вы действительно хотите безвозвратно удалить свой отзыв на станцию <strong style="color: #ffd700;">"{{ review.station.name }}"</strong>?</p>

    <div style="background: #0a0f2a; padding: 15px; border-radius: 5px; margin: 20px 0; text-align: left; font-style: italic; color: #ddd; border: 1px solid #4a6fa5;">
        "{{ review.text }}"
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
            <a href="{% url 'stations:station_detail' review.station.id %}" style="padding: 10px 20px; background: #1a1f3a; color: #ffd700; text-decoration: none; border: 1px solid #4a6fa5; border-radius: 5px; font-weight: bold;">
                Нет, отменить 🌟
            </a>

            <button type="submit" style="background: #ff6b6b; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Да, удалить 🗑️
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}

    <h2 style="color: #ffd700; margin-bottom: 20px;">✅ Пароль изменен</h2>
    
    <p style="color: #ddd; font-size: 16px; margin-bottom: 30px;">

    <a href="{% url 'crew:login' %}" style="background: #4a6fa5; color: white; padding: 12px 30px; text-decoration: none; border-radius: 8px; display: inline-block; font-weight: bold;">

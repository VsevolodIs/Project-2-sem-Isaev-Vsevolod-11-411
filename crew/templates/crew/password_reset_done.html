{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 30px; border: 2px solid #4a6fa5; border-radius: 15px; background-color: #1a1f3a; text-align: center;">
    <h2 style="color: #ffd700; margin-bottom: 20px;">📧 Письмо отправлено</h2>
    
    <p style="color: #ddd; font-size: 16px; margin-bottom: 20px;">
        Мы отправили инструкцию по восстановлению пароля на ваш email.
    </p>
    
    <p style="color: #888; font-size: 14px; margin-bottom: 30px;">
        Если вы не получили письмо, проверьте папку "Спам" или убедитесь, что ввели правильный email.
    </p>
    
    <a href="{% url 'crew:login' %}" style="background: #4a6fa5; color: white; padding: 10px 25px; text-decoration: none; border-radius: 8px; display: inline-block;">
        Вернуться ко входу
    </a>
</div>
{% endblock %}
